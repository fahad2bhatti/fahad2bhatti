<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><style>
text{font-family:Georgia,'Times New Roman',serif}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes swing{from{opacity:0;transform:translateY(60px) rotate(-6deg)}60%{opacity:1;transform:translateY(-8px) rotate(1deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cell{transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:bottom}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="900" height="260" rx="18" fill="#f6f1e7"/>
<defs><linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
<stop offset="0" stop-color="#1a1a1a"/><stop offset=".42" stop-color="#1a1a1a"/>
<stop offset=".5" stop-color="#2563eb"/><stop offset=".58" stop-color="#1a1a1a"/>
<stop offset="1" stop-color="#1a1a1a"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="600 0" dur="5s" repeatCount="indefinite"/>
</linearGradient></defs>
<text x="52" y="70" font-size="22" fill="#6b665c" class="sans" style="animation:rise .8s ease-out backwards">Hi, I'm</text>
<text x="48" y="155" font-size="88" fill="url(#sh)" style="animation:rise .9s .2s ease-out backwards">Fahad</text>
<text x="52" y="198" font-size="24" fill="#1a1a1a" class="sans" style="animation:rise .9s .5s ease-out backwards">Flutter developer · Firebase · AI/ML</text>
<circle cx="58" cy="228" r="5" fill="#2563eb" style="animation:pulse 2s ease-in-out infinite"/>
<text x="72" y="233" font-size="15" fill="#6b665c" class="sans" style="animation:rise .9s .7s ease-out backwards">BSCS student at NUML, Pakistan · available on Fiverr</text>
<circle cx="800" cy="80" r="46" fill="#2563eb" opacity=".12"/>
<circle cx="740" cy="170" r="26" fill="#f5b301" opacity=".25"/>
<circle cx="840" cy="190" r="18" fill="#e5484d" opacity=".2"/></svg>