<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><style>
text{font-family:Georgia,'Times New Roman',serif}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes swing{from{opacity:0;transform:translateY(60px) rotate(-6deg)}60%{opacity:1;transform:translateY(-8px) rotate(1deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cell{transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:bottom}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="900" height="330" rx="18" fill="#f6f1e7"/><text x="48" y="72" font-size="40" fill="#1a1a1a" style="animation:rise .7s 1.6s backwards">620</text><text x="48" y="98" font-size="14" fill="#6b665c" class="sans" style="animation:fade .7s 1.8s backwards">contributions</text><text x="258" y="72" font-size="40" fill="#1a1a1a" style="animation:rise .7s 1.7s backwards">0 days</text><text x="258" y="98" font-size="14" fill="#6b665c" class="sans" style="animation:fade .7s 1.9s backwards">current streak</text><text x="468" y="72" font-size="40" fill="#1a1a1a" style="animation:rise .7s 1.8s backwards">135</text><text x="468" y="98" font-size="14" fill="#6b665c" class="sans" style="animation:fade .7s 2.0s backwards">active days</text><text x="678" y="72" font-size="40" fill="#1a1a1a" style="animation:rise .7s 1.9s backwards">34</text><text x="678" y="98" font-size="14" fill="#6b665c" class="sans" style="animation:fade .7s 2.1s backwards">busiest day · Nov 07</text><rect class="bar" x="59.0" y="286.0" width="45" height="4.0" rx="6" fill="#cfc8b8" style="animation:grow .7s 1.90s ease-out backwards"/><text x="81.5" y="312" font-size="13" text-anchor="middle" fill="#6b665c" class="sans">Dec</text><rect class="bar" x="126.0" y="286.0" width="45" height="4.0" rx="6" fill="#cfc8b8" style="animation:grow .7s 1.96s ease-out backwards"/><text x="148.5" y="312" font-size="13" text-anchor="middle" fill="#6b665c" class="sans">Jan</text><rect class="bar" x="193.0" y="286.0" width="45" height="4.0" rx="6" fill="#cfc8b8" style="animation:grow .7s 2.02s ease-out backwards"/><text x="215.5" y="312" font-size="13" text-anchor="middle" fill="#6b665c" class="sans">Feb</text><rect class="bar" x="260.0" y="286.0" width="45" height="4.0" rx="6" fill="#cfc8b8" style="animation:grow .7s 2.08s ease-out backwards"/><text x="282.5" y="312" font-size="13" text-anchor="middle" fill="#6b665c" class="sans">Mar</text><rect class="bar" x="327.0" y="269.4" width="45" height="20.6" rx="6" fill="#